name: 功能建議 / Feature request
description: 建議符合單一部署者發佈範圍的改善。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        請說明使用情境與產品邊界，不要加入私人內容、未公開計劃、Cloudflare identifiers 或 secret。
        Describe the use case and product boundary without private content, non-public plans, Cloudflare identifiers, or secrets.

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前確認 / Before submitting
      options:
        - label: 我已搜尋現有 issues 及文檔。 / I searched existing issues and documentation.
          required: true
        - label: 建議不需要提交 production data、私人來源或 secret。 / The proposal requires no production data, private sources, or secrets.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解決的問題 / Problem to solve
      description: 描述目前使用者遇到的限制，不要只描述實作方法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建議行為 / Proposed behaviour
      description: 說明完成後使用者能做甚麼，以及預期的 public／protected 邊界。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮方案 / Alternatives considered

  - type: checkboxes
    id: impact
    attributes:
      label: 可能影響 / Possible impact
      options:
        - label: Public pages or feeds
        - label: Studio or write APIs
        - label: D1 migration or stored data
        - label: R2 media
        - label: Cloudflare Access or secrets
        - label: Cron or external retrieval
        - label: Documentation only

  - type: textarea
    id: validation
    attributes:
      label: 建議驗證 / Suggested validation
      description: 可列出測試、responsive QA、preview 或 deployment checks。
